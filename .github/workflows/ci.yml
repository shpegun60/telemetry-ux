# Installed generator and application consumers, with immutable SDK inputs. MIT.
name: Installed codegen

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  configurator:
    name: Installed pure Qt Configurator (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt without any Telemetry SDK checkout
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - name: Install, relocate and embed the view in an independent host
        run: |
          python3 -B tests/qml_package/run.py --build-dir "$RUNNER_TEMP/ux-qml-package" \
            --qt-prefix /usr --cxx g++ --cmake cmake --ninja ninja
      - name: Retain package and consumer receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-pure-qt-configurator
          if-no-files-found: warn
          path: ${{ runner.temp }}/ux-qml-package/

  installed-codegen:
    name: Installed codegen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout UX
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact SDK consumer gate
        uses: actions/checkout@v4
        with:
          repository: shpegun60/telemetry-sdk
          ref: 9f0364baa039137e71b45ff59b2a3f49e94be5af
          path: .ci/telemetry-sdk
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned package builders
        run: python -m pip install setuptools==80.9.0 wheel==0.45.1
      - name: Qualify installed core, UX and full distributions
        run: |
          $expected = '9f0364baa039137e71b45ff59b2a3f49e94be5af'
          $actual = git -C .ci/telemetry-sdk rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
              throw "SDK checkout does not match the pinned qualification input"
          }
          $proof = Join-Path $env:RUNNER_TEMP 'telemetry-ux-codegen'
          python -B .ci/telemetry-sdk/tests/ux_codegen_extension/run.py `
              --ux-root $env:GITHUB_WORKSPACE --build-dir $proof
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain qualification receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-codegen-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/telemetry-ux-codegen/summary.json
            ${{ runner.temp }}/telemetry-ux-codegen/*.log

  inspector:
    name: Installed SDK Inspector (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout qualified SDK transport components
        uses: actions/checkout@v4
        with:
          repository: shpegun60/telemetry-sdk
          ref: 6e15220b1271139b3f1996a16d385c660f856f45
          path: .ci/telemetry-sdk
          persist-credentials: false
      - name: Checkout private SDK serial dependency
        uses: actions/checkout@v4
        with:
          repository: shpegun60/cobs
          ref: 2e0abf260848fcb74e4a57b37532188047759643
          path: .ci/cobs
          persist-credentials: false
      - name: Install Qt host development and QML runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build qt6-base-dev qt6-declarative-dev libqt6serialport6-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - name: Install and relocate the SDK prefix
        run: |
          test "$(git -C .ci/telemetry-sdk rev-parse HEAD)" = 6e15220b1271139b3f1996a16d385c660f856f45
          cmake -S .ci/telemetry-sdk -B "$RUNNER_TEMP/sdk-build" -G Ninja \
            '-DTELEMETRY_COMPONENTS=inspector;workbench;read_many_workbench;encoded_backend;encoded_server;core;tcp_server;qt_serial_transport;resource_adapter' \
            -DCOBS_ROOT="$GITHUB_WORKSPACE/.ci/cobs" -DCMAKE_BUILD_TYPE=Release \
            -DTELEMETRY_SOURCE_REVISION=6e15220b1271139b3f1996a16d385c660f856f45 \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdk-prefix-stage"
          cmake --build "$RUNNER_TEMP/sdk-build" --target install --parallel 2
          mv "$RUNNER_TEMP/sdk-prefix-stage" "$RUNNER_TEMP/sdk-prefix"
      - name: Actual Inspector models, input and QML windows
        run: |
          python3 -B tests/inspector_qml/run.py --build-dir "$RUNNER_TEMP/ux-inspector-qml" \
            --sdk-prefix "$RUNNER_TEMP/sdk-prefix" --qt-prefix /usr --cxx g++ --cmake cmake --ninja ninja
      - name: Sanitized UX TCP discovery and QML window
        run: |
          python3 -B tests/inspector_tcp/run.py --build-dir "$RUNNER_TEMP/ux-inspector-tcp" \
            --sdk-prefix "$RUNNER_TEMP/sdk-prefix" --qt-prefix /usr --cxx clang++-18 --sanitize --cmake cmake --ninja ninja
      - name: Retain separate UX and installed SDK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-sdk-inspector
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ux-inspector-qml/
            ${{ runner.temp }}/ux-inspector-tcp/
            ${{ runner.temp }}/sdk-prefix/share/telemetry/SDKMetadata.json

  web-configurator:
    name: Installed web Configurator (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SDK_EXPECTED_REVISION: 6e15220b1271139b3f1996a16d385c660f856f45
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/web-chromium
    steps:
      - name: Checkout UX
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact headless SDK and starter hook
        uses: actions/checkout@v4
        with:
          repository: shpegun60/telemetry-sdk
          ref: 6e15220b1271139b3f1996a16d385c660f856f45
          path: .ci/telemetry-sdk
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install headless compilers and pinned browser tooling
        run: |
          set -euo pipefail
          test "$(git -C .ci/telemetry-sdk rev-parse HEAD)" = "$SDK_EXPECTED_REVISION"
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build g++ python3-venv
          python -m venv "$RUNNER_TEMP/web-builder"
          "$RUNNER_TEMP/web-builder/bin/python" -m pip install setuptools==80.9.0 wheel==0.45.1 playwright==1.63.0
          "$RUNNER_TEMP/web-builder/bin/python" -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/web-tools" --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.3
          node --version
          "$RUNNER_TEMP/web-builder/bin/python" -m pip list
      - name: Build and install matching core and UX wheels outside checkouts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web-core-source" "$RUNNER_TEMP/web-ux-source" "$RUNNER_TEMP/web-wheels"
          git -C .ci/telemetry-sdk archive HEAD | tar -x -C "$RUNNER_TEMP/web-core-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/web-ux-source"
          "$RUNNER_TEMP/web-builder/bin/python" -m pip wheel --no-deps --no-build-isolation \
            "$RUNNER_TEMP/web-core-source" "$RUNNER_TEMP/web-ux-source" -w "$RUNNER_TEMP/web-wheels" \
            2>&1 | tee "$RUNNER_TEMP/web-wheels-build.log"
          python -m venv "$RUNNER_TEMP/web-codegen"
          "$RUNNER_TEMP/web-codegen/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/web-wheels" \
            telemetry-codegen-core==0.1.0 telemetry-ux-codegen==0.1.0 \
            2>&1 | tee "$RUNNER_TEMP/web-wheels-install.log"
      - name: Install and relocate headless GCC and sanitized Clang SDK prefixes
        run: |
          set -euo pipefail
          for profile in gcc clang-asan; do
            compiler=g++
            flags=()
            if [ "$profile" = clang-asan ]; then
              compiler=clang++-18
              flags+=("-DCMAKE_CXX_FLAGS_RELEASE=-O1 -g -DNDEBUG -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer")
            fi
            cmake -S .ci/telemetry-sdk -B "$RUNNER_TEMP/web-sdk-build-$profile" -G Ninja \
              '-DTELEMETRY_COMPONENTS=core;encoded_server' -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON \
              -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
              -DTELEMETRY_SOURCE_REVISION="$SDK_EXPECTED_REVISION" \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/web-sdk-stage-$profile" "${flags[@]}" \
              2>&1 | tee "$RUNNER_TEMP/web-sdk-configure-$profile.log"
            cmake --build "$RUNNER_TEMP/web-sdk-build-$profile" --target install --parallel 2 \
              2>&1 | tee "$RUNNER_TEMP/web-sdk-build-$profile.log"
            mv "$RUNNER_TEMP/web-sdk-stage-$profile" "$RUNNER_TEMP/web-sdk-prefix-$profile"
          done
      - name: Pack the actual headless SDK JavaScript package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web-dist"
          cd .ci/telemetry-sdk
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/web-dist" \
            --cache "$RUNNER_TEMP/web-npm-cache" | tee "$RUNNER_TEMP/web-sdk-npm-pack.json"
          test -f "$RUNNER_TEMP/web-dist/telemetry-sdk-0.1.0.tgz"
      - name: Installed GCC provider and generated-page browser journeys
        run: |
          set -euo pipefail
          python -B tests/web_configurator/run.py --build-dir "$RUNNER_TEMP/ux-web-gcc" \
            --sdk-prefix "$RUNNER_TEMP/web-sdk-prefix-gcc" \
            --sdk-package "$RUNNER_TEMP/web-dist/telemetry-sdk-0.1.0.tgz" \
            --codegen-python "$RUNNER_TEMP/web-codegen/bin/python" \
            --browser-python "$RUNNER_TEMP/web-builder/bin/python" \
            --node "$(command -v node)" --tsc "$RUNNER_TEMP/web-tools/node_modules/typescript/bin/tsc" \
            --npm-js "$(npm root -g)/npm/bin/npm-cli.js" --cxx g++ --cmake cmake --ninja ninja
      - name: Installed Clang ASan and UBSan provider and browser journeys
        run: |
          set -euo pipefail
          python -B tests/web_configurator/run.py --build-dir "$RUNNER_TEMP/ux-web-clang-asan" \
            --sdk-prefix "$RUNNER_TEMP/web-sdk-prefix-clang-asan" \
            --sdk-package "$RUNNER_TEMP/web-dist/telemetry-sdk-0.1.0.tgz" \
            --codegen-python "$RUNNER_TEMP/web-codegen/bin/python" \
            --browser-python "$RUNNER_TEMP/web-builder/bin/python" \
            --node "$(command -v node)" --tsc "$RUNNER_TEMP/web-tools/node_modules/typescript/bin/tsc" \
            --npm-js "$(npm root -g)/npm/bin/npm-cli.js" --cxx clang++-18 --sanitize --cmake cmake --ninja ninja
      - name: Public IR and thin generated-page ownership controls
        run: |
          python -B tests/web_starter/run.py --sdk-root .ci/telemetry-sdk \
            --build-dir "$RUNNER_TEMP/ux-web-starter" --node "$(command -v node)"
      - name: Retain installed browser, native and package receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-web-configurator
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ux-web-gcc/summary.json
            ${{ runner.temp }}/ux-web-gcc/*.log
            ${{ runner.temp }}/ux-web-gcc/browser/
            ${{ runner.temp }}/ux-web-clang-asan/summary.json
            ${{ runner.temp }}/ux-web-clang-asan/*.log
            ${{ runner.temp }}/ux-web-clang-asan/browser/
            ${{ runner.temp }}/ux-web-starter/summary.json
            ${{ runner.temp }}/ux-web-starter/node.log
            ${{ runner.temp }}/web-*.log
            ${{ runner.temp }}/web-sdk-npm-pack.json
            ${{ runner.temp }}/web-sdk-prefix-gcc/share/telemetry/SDKMetadata.json
            ${{ runner.temp }}/web-sdk-prefix-clang-asan/share/telemetry/SDKMetadata.json
