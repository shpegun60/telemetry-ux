name: Installed codegen

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installed-codegen:
    name: Installed codegen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout UX
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact SDK consumer gate
        uses: actions/checkout@v4
        with:
          repository: shpegun60/telemetry-sdk
          ref: 9f0364baa039137e71b45ff59b2a3f49e94be5af
          path: .ci/telemetry-sdk
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned package builders
        run: python -m pip install setuptools==80.9.0 wheel==0.45.1
      - name: Qualify installed core, UX and full distributions
        run: |
          $expected = '9f0364baa039137e71b45ff59b2a3f49e94be5af'
          $actual = git -C .ci/telemetry-sdk rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
              throw "SDK checkout does not match the pinned qualification input"
          }
          $proof = Join-Path $env:RUNNER_TEMP 'telemetry-ux-codegen'
          python -B .ci/telemetry-sdk/tests/ux_codegen_extension/run.py `
              --ux-root $env:GITHUB_WORKSPACE --build-dir $proof
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain qualification receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-codegen-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/telemetry-ux-codegen/summary.json
            ${{ runner.temp }}/telemetry-ux-codegen/*.log
