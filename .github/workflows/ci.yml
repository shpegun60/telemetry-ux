# Installed generator and application consumers, with immutable SDK inputs. MIT.
name: Installed codegen

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      sdk_revision:
        description: Optional exact SDK commit for the release-pair qualification
        type: string
        default: ''
      ux_revision:
        description: Exact UX commit to check out for the release-pair qualification
        type: string
        default: ''

permissions:
  contents: read

env:
  UX_EXPECTED_REVISION: ${{ inputs.ux_revision || github.event.pull_request.head.sha || github.sha }}

jobs:
  configurator:
    name: Installed pure Qt Configurator (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.UX_EXPECTED_REVISION }}
          persist-credentials: false
      # Pinned CI helper; independent of the UX revision checked out as the test input.
      - name: Bound Ubuntu package downloads
        uses: shpegun60/telemetry-sdk/.github/actions/setup-apt@13884dc941a04039e5d91c691480f79447ae9ed8
      - name: Install Qt without any Telemetry SDK checkout
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - name: Install, relocate and embed the view in an independent host
        run: |
          python3 -B tests/qml_package/run.py --build-dir "$RUNNER_TEMP/ux-qml-package" \
            --qt-prefix /usr --cxx g++ --cmake cmake --ninja ninja
      - name: Retain package and consumer receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-pure-qt-configurator
          if-no-files-found: warn
          path: ${{ runner.temp }}/ux-qml-package/

  installed-codegen:
    name: Installed codegen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SDK_EXPECTED_REVISION: ${{ inputs.sdk_revision || '9f0364baa039137e71b45ff59b2a3f49e94be5af' }}
    steps:
      - name: Checkout UX
        uses: actions/checkout@v4
        with:
          ref: ${{ env.UX_EXPECTED_REVISION }}
          persist-credentials: false
      - name: Checkout exact SDK consumer gate
        uses: actions/checkout@v4
        with:
          repository: shpegun60/telemetry-sdk
          ref: ${{ env.SDK_EXPECTED_REVISION }}
          path: .ci/telemetry-sdk
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned package builders
        run: python -m pip install setuptools==80.9.0 wheel==0.45.1
      - name: Qualify installed core, UX and full distributions
        run: |
          $expected = $env:SDK_EXPECTED_REVISION
          $actual = git -C .ci/telemetry-sdk rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
              throw "SDK checkout does not match the pinned qualification input"
          }
          $proof = Join-Path $env:RUNNER_TEMP 'telemetry-ux-codegen'
          python -B .ci/telemetry-sdk/tests/ux_codegen_extension/run.py `
              --ux-root $env:GITHUB_WORKSPACE --build-dir $proof
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain qualification receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-codegen-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/telemetry-ux-codegen/summary.json
            ${{ runner.temp }}/telemetry-ux-codegen/*.log

  inspector:
    name: Installed SDK Inspector (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SDK_EXPECTED_REVISION: ${{ inputs.sdk_revision || '6e15220b1271139b3f1996a16d385c660f856f45' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.UX_EXPECTED_REVISION }}
          persist-credentials: false
      - name: Checkout qualified SDK transport components
        uses: actions/checkout@v4
        with:
          repository: shpegun60/telemetry-sdk
          ref: ${{ env.SDK_EXPECTED_REVISION }}
          path: .ci/telemetry-sdk
          persist-credentials: false
      - name: Checkout private SDK serial dependency
        uses: actions/checkout@v4
        with:
          repository: shpegun60/cobs
          ref: 2e0abf260848fcb74e4a57b37532188047759643
          path: .ci/cobs
          persist-credentials: false
      - name: Bound Ubuntu package downloads
        uses: shpegun60/telemetry-sdk/.github/actions/setup-apt@13884dc941a04039e5d91c691480f79447ae9ed8
      - name: Install Qt host development and QML runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build qt6-base-dev qt6-declarative-dev libqt6serialport6-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - name: Install and relocate the SDK prefix
        run: |
          test "$(git -C .ci/telemetry-sdk rev-parse HEAD)" = "$SDK_EXPECTED_REVISION"
          cmake -S .ci/telemetry-sdk -B "$RUNNER_TEMP/sdk-build" -G Ninja \
            '-DTELEMETRY_COMPONENTS=inspector;workbench;read_many_workbench;encoded_backend;encoded_server;core;tcp_server;qt_serial_transport;resource_adapter' \
            -DCOBS_ROOT="$GITHUB_WORKSPACE/.ci/cobs" -DCMAKE_BUILD_TYPE=Release \
            -DTELEMETRY_SOURCE_REVISION="$SDK_EXPECTED_REVISION" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdk-prefix-stage"
          cmake --build "$RUNNER_TEMP/sdk-build" --target install --parallel 2
          mv "$RUNNER_TEMP/sdk-prefix-stage" "$RUNNER_TEMP/sdk-prefix"
      - name: Actual Inspector models, input and QML windows
        run: |
          python3 -B tests/inspector_qml/run.py --build-dir "$RUNNER_TEMP/ux-inspector-qml" \
            --sdk-prefix "$RUNNER_TEMP/sdk-prefix" --qt-prefix /usr --cxx g++ --cmake cmake --ninja ninja
      - name: Sanitized UX TCP discovery and QML window
        run: |
          python3 -B tests/inspector_tcp/run.py --build-dir "$RUNNER_TEMP/ux-inspector-tcp" \
            --sdk-prefix "$RUNNER_TEMP/sdk-prefix" --qt-prefix /usr --cxx clang++-18 --sanitize --cmake cmake --ninja ninja
      - name: Retain separate UX and installed SDK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-sdk-inspector
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ux-inspector-qml/
            ${{ runner.temp }}/ux-inspector-tcp/
            ${{ runner.temp }}/sdk-prefix/share/telemetry/SDKMetadata.json

  web-configurator:
    name: Installed web Configurator (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SDK_EXPECTED_REVISION: ${{ inputs.sdk_revision || '6e15220b1271139b3f1996a16d385c660f856f45' }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout UX
        uses: actions/checkout@v4
        with:
          ref: ${{ env.UX_EXPECTED_REVISION }}
          persist-credentials: false
      - name: Checkout exact headless SDK and starter hook
        uses: actions/checkout@v4
        with:
          repository: shpegun60/telemetry-sdk
          ref: ${{ env.SDK_EXPECTED_REVISION }}
          path: .ci/telemetry-sdk
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bound Ubuntu package downloads
        uses: shpegun60/telemetry-sdk/.github/actions/setup-apt@13884dc941a04039e5d91c691480f79447ae9ed8
      - name: Install headless compilers and pinned browser tooling
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/web-chromium"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          test "$(git -C .ci/telemetry-sdk rev-parse HEAD)" = "$SDK_EXPECTED_REVISION"
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build g++ python3-venv
          python -m venv "$RUNNER_TEMP/web-builder"
          "$RUNNER_TEMP/web-builder/bin/python" -m pip install setuptools==80.9.0 wheel==0.45.1 playwright==1.63.0 websockets==15.0.1
          "$RUNNER_TEMP/web-builder/bin/python" -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/web-tools" --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.3
          node --version
          "$RUNNER_TEMP/web-builder/bin/python" -m pip list
      - name: Build and install matching core and UX wheels outside checkouts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web-core-source" "$RUNNER_TEMP/web-ux-source" "$RUNNER_TEMP/web-wheels"
          git -C .ci/telemetry-sdk archive HEAD | tar -x -C "$RUNNER_TEMP/web-core-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/web-ux-source"
          "$RUNNER_TEMP/web-builder/bin/python" -m pip wheel --no-deps --no-build-isolation \
            "$RUNNER_TEMP/web-core-source" "$RUNNER_TEMP/web-ux-source" -w "$RUNNER_TEMP/web-wheels" \
            2>&1 | tee "$RUNNER_TEMP/web-wheels-build.log"
          python -m venv "$RUNNER_TEMP/web-codegen"
          "$RUNNER_TEMP/web-codegen/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/web-wheels" \
            telemetry-codegen-core==0.1.0 telemetry-ux-codegen==0.1.0 \
            2>&1 | tee "$RUNNER_TEMP/web-wheels-install.log"
      - name: Install and relocate headless GCC and sanitized Clang SDK prefixes
        run: |
          set -euo pipefail
          for profile in gcc clang-asan; do
            compiler=g++
            flags=()
            if [ "$profile" = clang-asan ]; then
              compiler=clang++-18
              flags+=("-DCMAKE_CXX_FLAGS_RELEASE=-O1 -g -DNDEBUG -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer")
            fi
            cmake -S .ci/telemetry-sdk -B "$RUNNER_TEMP/web-sdk-build-$profile" -G Ninja \
              '-DTELEMETRY_COMPONENTS=core;encoded_server;batch_server;resource_adapter' -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON \
              -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
              -DTELEMETRY_SOURCE_REVISION="$SDK_EXPECTED_REVISION" \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/web-sdk-stage-$profile" "${flags[@]}" \
              2>&1 | tee "$RUNNER_TEMP/web-sdk-configure-$profile.log"
            cmake --build "$RUNNER_TEMP/web-sdk-build-$profile" --target install --parallel 2 \
              2>&1 | tee "$RUNNER_TEMP/web-sdk-build-$profile.log"
            mv "$RUNNER_TEMP/web-sdk-stage-$profile" "$RUNNER_TEMP/web-sdk-prefix-$profile"
          done
      - name: Pack the actual headless SDK JavaScript package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web-dist"
          cd .ci/telemetry-sdk
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/web-dist" \
            --cache "$RUNNER_TEMP/web-npm-cache" | tee "$RUNNER_TEMP/web-sdk-npm-pack.json"
          test -f "$RUNNER_TEMP/web-dist/telemetry-sdk-0.1.0.tgz"
      - name: Installed GCC provider and generated-page browser journeys
        run: |
          set -euo pipefail
          python -B tests/web_configurator/run.py --build-dir "$RUNNER_TEMP/ux-web-gcc" \
            --sdk-prefix "$RUNNER_TEMP/web-sdk-prefix-gcc" \
            --sdk-package "$RUNNER_TEMP/web-dist/telemetry-sdk-0.1.0.tgz" \
            --codegen-python "$RUNNER_TEMP/web-codegen/bin/python" \
            --browser-python "$RUNNER_TEMP/web-builder/bin/python" \
            --node "$(command -v node)" --tsc "$RUNNER_TEMP/web-tools/node_modules/typescript/bin/tsc" \
            --npm-js "$(npm root -g)/npm/bin/npm-cli.js" --cxx g++ --cmake cmake --ninja ninja
      - name: Installed Clang ASan and UBSan provider and browser journeys
        run: |
          set -euo pipefail
          python -B tests/web_configurator/run.py --build-dir "$RUNNER_TEMP/ux-web-clang-asan" \
            --sdk-prefix "$RUNNER_TEMP/web-sdk-prefix-clang-asan" \
            --sdk-package "$RUNNER_TEMP/web-dist/telemetry-sdk-0.1.0.tgz" \
            --codegen-python "$RUNNER_TEMP/web-codegen/bin/python" \
            --browser-python "$RUNNER_TEMP/web-builder/bin/python" \
            --node "$(command -v node)" --tsc "$RUNNER_TEMP/web-tools/node_modules/typescript/bin/tsc" \
            --npm-js "$(npm root -g)/npm/bin/npm-cli.js" --cxx clang++-18 --sanitize --cmake cmake --ninja ninja
      - name: Installed declarative element lifecycle, SSR and type consumers
        run: |
          set -euo pipefail
          python -B tests/web_element/run.py --build-dir "$RUNNER_TEMP/ux-web-element" \
            --sdk-package "$RUNNER_TEMP/web-dist/telemetry-sdk-0.1.0.tgz" \
            --browser-python "$RUNNER_TEMP/web-builder/bin/python" \
            --node "$(command -v node)" --tsc "$RUNNER_TEMP/web-tools/node_modules/typescript/bin/tsc" \
            --npm-js "$(npm root -g)/npm/bin/npm-cli.js"
      - name: Installed WebSocket carrier, lease and browser journeys
        run: |
          set -euo pipefail
          for profile in gcc clang-asan; do
            compiler=g++
            checks=()
            if [ "$profile" = clang-asan ]; then
              compiler=clang++-18
              checks+=(--sanitize)
            fi
            python -B tests/websocket_transport/run.py --build-dir "$RUNNER_TEMP/ux-websocket-$profile" \
              --sdk-prefix "$RUNNER_TEMP/web-sdk-prefix-$profile" \
              --sdk-package "$RUNNER_TEMP/web-dist/telemetry-sdk-0.1.0.tgz" \
              --codegen-python "$RUNNER_TEMP/web-codegen/bin/python" \
              --browser-python "$RUNNER_TEMP/web-builder/bin/python" \
              --node "$(command -v node)" --tsc "$RUNNER_TEMP/web-tools/node_modules/typescript/bin/tsc" \
              --npm-js "$(npm root -g)/npm/bin/npm-cli.js" \
              --cxx "$compiler" --cmake cmake --ninja ninja "${checks[@]}"
          done
      - name: Export relocated firmware web assets and exercise the deployed UI
        run: |
          set -euo pipefail
          python -B tests/web_assets/run.py --build-dir "$RUNNER_TEMP/ux-web-assets" \
            --public-root "$RUNNER_TEMP/ux-web-gcc/public" --cxx g++ \
            --browser-python "$RUNNER_TEMP/web-builder/bin/python" \
            --device "$RUNNER_TEMP/ux-web-gcc/native/telemetry_web_demo_peer"
      - name: Installed Descriptor and payload-file tools in Chromium
        run: |
          set -euo pipefail
          for profile in gcc clang-asan; do
            compiler=g++
            checks=()
            if [ "$profile" = clang-asan ]; then
              compiler=clang++-18
              checks+=(--sanitize)
            fi
            python -B tests/structured_client/run.py --build-dir "$RUNNER_TEMP/ux-structured-tools-$profile" \
              --sdk-prefix "$RUNNER_TEMP/web-sdk-prefix-$profile" \
              --sdk-package "$RUNNER_TEMP/web-dist/telemetry-sdk-0.1.0.tgz" \
              --browser-python "$RUNNER_TEMP/web-builder/bin/python" \
              --node "$(command -v node)" --npm-js "$(npm root -g)/npm/bin/npm-cli.js" \
              --cxx "$compiler" --cmake cmake --ninja ninja "${checks[@]}"
          done
      - name: Public IR and thin generated-page ownership controls
        run: |
          python -B tests/web_starter/run.py --sdk-root .ci/telemetry-sdk \
            --build-dir "$RUNNER_TEMP/ux-web-starter" --node "$(command -v node)"
      - name: Retain installed browser, native and package receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-web-configurator
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ux-web-gcc/summary.json
            ${{ runner.temp }}/ux-web-gcc/*.log
            ${{ runner.temp }}/ux-web-gcc/browser/
            ${{ runner.temp }}/ux-web-clang-asan/summary.json
            ${{ runner.temp }}/ux-web-clang-asan/*.log
            ${{ runner.temp }}/ux-web-clang-asan/browser/
            ${{ runner.temp }}/ux-web-element/summary.json
            ${{ runner.temp }}/ux-web-element/*.log
            ${{ runner.temp }}/ux-web-element/browser/summary.json
            ${{ runner.temp }}/ux-web-element/dist/*.tgz
            ${{ runner.temp }}/ux-websocket-gcc/summary.json
            ${{ runner.temp }}/ux-websocket-gcc/*.log
            ${{ runner.temp }}/ux-websocket-gcc/server-unit.json
            ${{ runner.temp }}/ux-websocket-gcc/http-browser/
            ${{ runner.temp }}/ux-websocket-gcc/ws-browser/
            ${{ runner.temp }}/ux-websocket-clang-asan/summary.json
            ${{ runner.temp }}/ux-websocket-clang-asan/*.log
            ${{ runner.temp }}/ux-websocket-clang-asan/server-unit.json
            ${{ runner.temp }}/ux-websocket-clang-asan/http-browser/
            ${{ runner.temp }}/ux-websocket-clang-asan/ws-browser/
            ${{ runner.temp }}/ux-web-assets/
            ${{ runner.temp }}/ux-web-starter/summary.json
            ${{ runner.temp }}/ux-web-starter/node.log
            ${{ runner.temp }}/ux-structured-tools-gcc/summary.json
            ${{ runner.temp }}/ux-structured-tools-gcc/*.log
            ${{ runner.temp }}/ux-structured-tools-gcc/fixtures/*.png
            ${{ runner.temp }}/ux-structured-tools-clang-asan/summary.json
            ${{ runner.temp }}/ux-structured-tools-clang-asan/*.log
            ${{ runner.temp }}/ux-structured-tools-clang-asan/fixtures/*.png
            ${{ runner.temp }}/web-*.log
            ${{ runner.temp }}/web-sdk-npm-pack.json
            ${{ runner.temp }}/web-sdk-prefix-gcc/share/telemetry/SDKMetadata.json
            ${{ runner.temp }}/web-sdk-prefix-clang-asan/share/telemetry/SDKMetadata.json

  generated-qml:
    name: Installed generated QML example (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SDK_EXPECTED_REVISION: ${{ inputs.sdk_revision || 'fe6169d97ed84c6c4ab9c36c9b4c7d52e86c825e' }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout UX
        uses: actions/checkout@v4
        with:
          ref: ${{ env.UX_EXPECTED_REVISION }}
          persist-credentials: false
      - name: Checkout exact SDK package producer
        uses: actions/checkout@v4
        with:
          repository: shpegun60/telemetry-sdk
          ref: ${{ env.SDK_EXPECTED_REVISION }}
          path: .ci/telemetry-sdk
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bound Ubuntu package downloads
        uses: shpegun60/telemetry-sdk/.github/actions/setup-apt@13884dc941a04039e5d91c691480f79447ae9ed8
      - name: Install Qt runtime, compilers and pinned wheel builders
        run: |
          set -euo pipefail
          test "$(git -C .ci/telemetry-sdk rev-parse HEAD)" = "$SDK_EXPECTED_REVISION"
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build g++ python3-venv \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick \
            qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtqml-workerscript
          python -m venv "$RUNNER_TEMP/qml-builder"
          "$RUNNER_TEMP/qml-builder/bin/python" -m pip install setuptools==80.9.0 wheel==0.45.1
      - name: Install matching core and UX generator wheels outside checkouts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qml-core-source" "$RUNNER_TEMP/qml-ux-source" "$RUNNER_TEMP/qml-wheels"
          git -C .ci/telemetry-sdk archive HEAD | tar -x -C "$RUNNER_TEMP/qml-core-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/qml-ux-source"
          "$RUNNER_TEMP/qml-builder/bin/python" -m pip wheel --no-deps --no-build-isolation \
            "$RUNNER_TEMP/qml-core-source" "$RUNNER_TEMP/qml-ux-source" -w "$RUNNER_TEMP/qml-wheels" \
            2>&1 | tee "$RUNNER_TEMP/qml-wheels-build.log"
          python -m venv "$RUNNER_TEMP/qml-codegen"
          "$RUNNER_TEMP/qml-codegen/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/qml-wheels" \
            telemetry-codegen-core==0.1.0 telemetry-ux-codegen==0.1.0 \
            2>&1 | tee "$RUNNER_TEMP/qml-wheels-install.log"
      - name: Install relocated headless SDKs and execute QML qualification
        run: |
          set -euo pipefail
          for profile in gcc clang-asan; do
            compiler=g++
            flags=()
            checks=()
            if [ "$profile" = clang-asan ]; then
              compiler=clang++-18
              flags+=("-DCMAKE_CXX_FLAGS_RELEASE=-O1 -g -DNDEBUG -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer")
              checks+=(--sanitize)
            fi
            cmake -S .ci/telemetry-sdk -B "$RUNNER_TEMP/qml-sdk-build-$profile" -G Ninja \
              '-DTELEMETRY_COMPONENTS=core;encoded_server;encoded_backend;rpc_backend;rpc_sessions' \
              -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON -DCMAKE_CXX_COMPILER="$compiler" \
              -DCMAKE_BUILD_TYPE=Release -DTELEMETRY_SOURCE_REVISION="$SDK_EXPECTED_REVISION" \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qml-sdk-stage-$profile" "${flags[@]}" \
              2>&1 | tee "$RUNNER_TEMP/qml-sdk-configure-$profile.log"
            cmake --build "$RUNNER_TEMP/qml-sdk-build-$profile" --target install --parallel 2 \
              2>&1 | tee "$RUNNER_TEMP/qml-sdk-build-$profile.log"
            mv "$RUNNER_TEMP/qml-sdk-stage-$profile" "$RUNNER_TEMP/qml-sdk-prefix-$profile"
            cmake -S . -B "$RUNNER_TEMP/static-ux-build-$profile" -G Ninja \
              -DTELEMETRY_UX_BUILD_INSPECTOR=OFF -DTELEMETRY_UX_BUILD_CONFIGURATOR=ON \
              -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/static-ux-stage-$profile" "${flags[@]}" \
              2>&1 | tee "$RUNNER_TEMP/static-ux-configure-$profile.log"
            cmake --build "$RUNNER_TEMP/static-ux-build-$profile" --target install --parallel 2 \
              2>&1 | tee "$RUNNER_TEMP/static-ux-build-$profile.log"
            mv "$RUNNER_TEMP/static-ux-stage-$profile" "$RUNNER_TEMP/static-ux-prefix-$profile"
            python -B tests/codegen_qml/run.py --build-dir "$RUNNER_TEMP/ux-generated-qml-$profile" \
              --sdk-prefix "$RUNNER_TEMP/qml-sdk-prefix-$profile" \
              --codegen-python "$RUNNER_TEMP/qml-codegen/bin/python" \
              --qt-prefix /usr --cxx "$compiler" --cmake cmake --ninja ninja "${checks[@]}"
            python -B tests/static_qml_configurator/run.py --build-dir "$RUNNER_TEMP/ux-static-qml-$profile" \
              --sdk-prefix "$RUNNER_TEMP/qml-sdk-prefix-$profile" \
              --ux-prefix "$RUNNER_TEMP/static-ux-prefix-$profile" \
              --codegen-python "$RUNNER_TEMP/qml-codegen/bin/python" \
              --qt-prefix /usr --cxx "$compiler" --cmake cmake --ninja ninja "${checks[@]}"
          done
      - name: Retain generated QML and installed package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-generated-qml-example
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ux-generated-qml-gcc/summary.json
            ${{ runner.temp }}/ux-generated-qml-gcc/*.log
            ${{ runner.temp }}/ux-generated-qml-gcc/probes/*.log
            ${{ runner.temp }}/ux-generated-qml-clang-asan/summary.json
            ${{ runner.temp }}/ux-generated-qml-clang-asan/*.log
            ${{ runner.temp }}/ux-generated-qml-clang-asan/probes/*.log
            ${{ runner.temp }}/qml-*.log
            ${{ runner.temp }}/qml-sdk-prefix-gcc/share/telemetry/SDKMetadata.json
            ${{ runner.temp }}/qml-sdk-prefix-clang-asan/share/telemetry/SDKMetadata.json
            ${{ runner.temp }}/ux-static-qml-gcc/**/*.json
            ${{ runner.temp }}/ux-static-qml-gcc/**/*.log
            ${{ runner.temp }}/ux-static-qml-gcc/**/*.png
            ${{ runner.temp }}/ux-static-qml-clang-asan/**/*.json
            ${{ runner.temp }}/ux-static-qml-clang-asan/**/*.log
            ${{ runner.temp }}/ux-static-qml-clang-asan/**/*.png
            ${{ runner.temp }}/static-ux-*.log
            ${{ runner.temp }}/static-ux-prefix-gcc/
            ${{ runner.temp }}/static-ux-prefix-clang-asan/
