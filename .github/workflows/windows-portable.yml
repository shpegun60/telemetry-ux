name: Windows portable Inspector

on:
  workflow_call:
    inputs:
      sdk_revision:
        required: true
        type: string
      ux_revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Produce Windows Inspector ZIP
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      SDK_REVISION: ${{ inputs.sdk_revision }}
      UX_REVISION: ${{ inputs.ux_revision }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ux_revision }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: shpegun60/telemetry-sdk
          ref: ${{ inputs.sdk_revision }}
          path: .ci/telemetry-sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: shpegun60/cobs
          ref: 2e0abf260848fcb74e4a57b37532188047759643
          path: .ci/cobs
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install one complete pinned Qt and MinGW kit
        run: |
          python -m pip install aqtinstall==3.3.0 cmake==3.31.6 ninja==1.11.1.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = Join-Path $env:RUNNER_TEMP 'Qt'
          python -m aqt install-qt windows desktop 6.10.1 win64_mingw --outputdir $root --modules qtserialport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the exact source pair and deploy actual UART-enabled executable
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Qt'
          $qt = Join-Path $root '6.10.1/mingw_64'
          $compiler = Join-Path $root 'Tools/mingw1310_64/bin/g++.exe'
          python -B packaging/windows/build.py --output "$env:RUNNER_TEMP/portable-inspector" `
            --sdk-root "$env:GITHUB_WORKSPACE/.ci/telemetry-sdk" --sdk-revision $env:SDK_REVISION `
            --ux-revision $env:UX_REVISION --qt-prefix $qt --cobs-root "$env:GITHUB_WORKSPACE/.ci/cobs" `
            --cxx $compiler --cmake (Get-Command cmake).Source --ninja (Get-Command ninja).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-inspector-distribution
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/portable-inspector/Telemetry-Inspector-Windows-x64.zip
            ${{ runner.temp }}/portable-inspector/Telemetry-Inspector-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-inspector-producer-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/portable-inspector/*.log
            ${{ runner.temp }}/portable-inspector/build-summary.json

  clean-runner:
    name: Windows portable Inspector (clean runner)
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ux_revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-inspector-distribution
          path: ${{ runner.temp }}/distribution
      # This job installs no Qt, Python package, compiler, CMake or GUI tool.
      - name: Relocate, verify hashes and run native QML journeys with an isolated PATH
        shell: pwsh
        env:
          SDK_REVISION: ${{ inputs.sdk_revision }}
          UX_REVISION: ${{ inputs.ux_revision }}
        run: |
          ./packaging/windows/VerifyPortable.ps1 `
            -Archive "$env:RUNNER_TEMP/distribution/Telemetry-Inspector-Windows-x64.zip" `
            -OutputDirectory "$env:RUNNER_TEMP/clean-qualification" `
            -SdkRevision $env:SDK_REVISION -UxRevision $env:UX_REVISION
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-inspector-clean-runner-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/clean-qualification/*.json
            ${{ runner.temp }}/clean-qualification/*.log
            ${{ runner.temp }}/clean-qualification/*.png
