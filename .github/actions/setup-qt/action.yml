# The project's Qt: the newest LTS, 6.12, from the Qt online repository rather
# than the distribution's (Ubuntu 24.04 ships 6.4). Cached between runs.
name: Install the project's Qt
description: Qt 6.12 LTS for Linux desktop with the system libraries Qt Gui needs, on CMAKE_PREFIX_PATH and PATH.
inputs:
  modules:
    description: Qt add-on modules, space separated (for example qtserialport)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: System libraries Qt Gui and the offscreen platform link
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgl-dev libegl-dev libxkbcommon-dev libfontconfig1 libdbus-1-3
    - name: Qt 6.12 LTS
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.12.0'
        host: linux
        target: desktop
        arch: linux_gcc_64
        modules: ${{ inputs.modules }}
        cache: true
    - name: Find Qt through CMake
      shell: bash
      run: |
        echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
        "$QT_ROOT_DIR/bin/qmake" -query QT_VERSION
